const workspace=`<div class="window">${titlebar(false,true)}<div class="shell"><aside class="sidebar glass"><div class="searchline"><label class="input">${icon('search')}<input aria-label="Search meetings" placeholder="搜索会议"></label><button class="icon primary add-meeting" aria-label="Add meeting" title="Add meeting">${icon('meeting-add')}</button></div><div class="projectline"><button class="project">${icon('folder')}Kanal-Project${icon('chevron')}</button><button class="icon ghost add-project" aria-label="Add project or import meeting" title="Add project or import meeting">${icon('project-add')}</button></div><div class="section-label">今天</div><button class="meeting selected">支架料号 KX-4402<small>10:32 · 中文 / 德语 / 波兰语</small></button><button class="meeting">供应商协调<small>09:00 · 42 分钟</small></button><div class="section-label">昨天</div><button class="meeting">公差讨论<small>10月04日 · 28 分钟</small></button><button class="meeting">生产交接<small>10月04日 · 36 分钟</small></button><div class="spacer"></div><div class="sidebar-footer">${ib('settings','Settings')}设置<span class="spacer"></span><span>本地工作空间</span></div></aside><section class="main"><div class="meeting-head"><div><h2>支架料号 KX-4402 <button class="icon ghost" aria-label="Regenerate meeting title" title="Regenerate meeting title">${icon('regenerate')}</button></h2><span class="sub" style="font-size:12px">2026.10.05 / Kanal-Project</span></div><button class="language-selector ghost" aria-label="Display languages unavailable while recording" title="Display languages" disabled>${flags}<span>ZH · DE · PL</span></button></div><div class="transcript multi-language"><div class="language-columns">${['ZH','DE','PL'].map((code,i)=>`<section class="language-column" data-language="${code}"><header><div><strong>${code}</strong><span>${['中文','Deutsch','Polski'][i]}</span></div><button class="icon ghost expand-language" aria-label="Expand ${code} to fill transcript area" title="Expand language column" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5m6 0h5v5M4 15v5h5m6 0h5v-5"/></svg></button></header><article><div class="speaker">S01 <span>ZH${i===0?' · 原文':''}</span></div><p>${['这批支架的料号是 KX-4402，表面处理按上次的标准做。','Die Materialnummer dieser Stütze ist KX-4402. Die Oberflächenbehandlung erfolgt gemäß dem Standard aus dem letzten Mal.','Numer partii tych ramion to KX-4402, obróbka powierzchniowa wykonana zgodnie z poprzednim standardem.'][i]}</p>${i===0?'':`<blockquote>这批支架的料号是 KX-4402，表面处理按上次的标准做。</blockquote>`}</article><article><div class="speaker">S02 <span>PL${i===2?' · 原文':''}</span></div><p>${['请确认交货日期为 8 月底前。','Wir bestätigen den Liefertermin bis zum Ende des Augusts.','Musimy potwierdzić termin dostawy przed końcem sierpnia.'][i]}</p>${i===2?'':'<blockquote>Musimy potwierdzić termin dostawy przed końcem sierpnia.</blockquote>'}</article><article><div class="speaker">S03 <span>DE${i===1?' · 原文':''}</span></div><p>${['图纸中的公差尚未批准。','Die Toleranzen im Zeichnungssatz sind noch nicht freigegeben.','Tolerancje w dokumentacji rysunkowej nie zostały jeszcze zatwierdzone.'][i]}</p></article></section>`).join('')}</div><div class="ruler">${'<i></i>'.repeat(18)}</div></div><div class="meeting-status"><span>录制中 / 本地处理 / 未保存音频</span><span class="spacer"></span><span>输入</span><span class="level"><i></i></span></div></section><aside class="assistant glass"><div class="tabs"><button class="selected">要点与决定</button><button>文件</button></div><div class="insight"><div class="tag">${icon('spark')}要点</div><p>KX-4402 支架沿用上次的表面处理标准。</p><div class="source">Li Wei · 10:32:14 ↗</div></div><div class="insight"><div class="tag">${icon('check')}决定 / 待确认</div><p>下一批生产前复核图纸，并确认公差。</p><div class="decision-actions"><button>确认决定</button><button class="ghost" aria-label="Dismiss decision">${icon('close')}</button></div><div class="source" style="margin-top:10px">Anna Müller · 10:32:28 ↗</div></div><div class="spacer"></div><div class="files-pane" hidden><p class="sub">此会议尚无附件。</p><button>${icon('download')}导入文件</button></div><div class="note">内容由模型整理，决定需人工确认。</div></aside></div></div>`;
const components=`<div class="board-grid"><section class="card"><h3>01 / 从现有图标建立系统</h3><div class="brand-study"><img src="../../../src/Kanal.Host/Assets/kanal-splash-mark.png" alt="当前 Kanal 图标"><div><strong>KANAL</strong><p>保留折带 K 的形状与双色。<br>布局借用它的留白与明确分区，<br>控件只保留轻微圆角。</p></div></div><div class="palette"><div><span class="swatch" style="background:#414b83"></span><span>靛蓝<small>#414B83 / 操作与选择</small></span></div><div><span class="swatch" style="background:#eaa66a"></span><span>杏橙<small>#EAA66A / 品牌细节</small></span></div><div><span class="swatch" style="background:#f4f0e8;border:1px solid #d9d5cd"></span><span>暖纸底<small>中性承载色</small></span></div></div></section><section class="card"><h3>02 / 排版先建立层级</h3><div class="type-sample">信息清楚，界面安静。</div><div class="type-grid"><small>标题 · 25 / 32</small><span style="font-size:25px;font-weight:600">支架料号 KX-4402</span></div><div class="type-grid"><small>列标题 · 24 / 30</small><span style="font-size:24px;font-weight:700">ZH <span style="font-size:12px;font-weight:400">中文</span></span></div><div class="type-grid"><small>正文 · 15 / 28</small><span>Die Toleranzen sind noch nicht freigegeben.</span></div><p class="sub" style="font-size:11px;margin:16px 0 0">Helvetica Neue / Segoe UI · 保留 CJK 回退字体<br>左对齐、共享基线、清晰黑白层次；色彩承担功能。</p></section><section class="card"><h3>03 / 按钮与状态</h3><div class="row"><button class="primary">开始会议</button><button>导出记录</button><button class="ghost">取消</button><button class="icon primary add-meeting" title="添加会议">${icon('meeting-add')}</button><button class="icon ghost add-project" title="添加项目">${icon('project-add')}</button></div><div class="row"><button class="hover">悬停</button><button class="focus">键盘焦点</button><button class="primary pressed">按下</button><button disabled>不可用</button></div><div class="row"><span class="state-label">未开始</span><button class="transport-mark start" aria-label="开始"><span class="record-disc"></span></button><span class="state-label">进行中</span><button class="transport-mark hold" aria-label="暂停">${icon('pause')}</button><button class="transport-mark stop" aria-label="结束">${icon('stop')}</button><span class="state-label">已暂停</span><button class="transport-mark hold" aria-label="继续">${icon('play')}</button><span class="status">录制中</span></div><p class="sub" style="font-size:11px;margin:0">36 px 点击区域 / 8 px 圆角 / 2 px 焦点框<br>对话框内＋表示新会议；文件夹内＋表示新项目。录制红、暂停黄沿用现有语义。</p></section><section class="card"><h3>04 / 输入与语言设置</h3><label class="field-label" for="device">音频输入</label><select id="device" class="forminput"><option>USB 麦克风 / 默认设备</option><option>内置麦克风</option></select><label class="field-label" for="rename">会议名称</label><input id="rename" class="forminput focus" value="支架料号 KX-4402"><div class="row" style="margin:20px 0 0"><button class="language-selector ghost">${flags}<span>ZH · DE · PL</span></button><label class="check"><input type="checkbox" checked>保存录音</label><label class="check"><input type="radio" checked>现场会议</label></div><p class="sub" style="font-size:11px;margin:14px 0 0">语言入口沿用当前旗标样式及现有选择逻辑。</p></section><section class="card"><h3>05 / 材质与动效</h3><div class="material-specimen"><div class="glass-popover"><strong>仅弹层使用轻磨砂</strong><p>正文和主面板保持暖纸表面。弹层采用高不透明度、细边线与极轻阴影。</p></div></div><p class="sub" style="font-size:11px;margin:17px 0 0">悬停 100–120 ms · 弹层 140 ms · 侧栏 180 ms<br>正文即时出现；单列放大不播放缩放动画。减少动态效果时静态切换。</p></section><section class="card"><h3>06 / 复用已有图形语言</h3><div class="icons">${['mic','qr','folder','settings','upload','download','more'].map(n=>`<div>${icon(n)}<small>${n}</small></div>`).join('')}</div><p class="sub" style="font-size:12px;line-height:1.8">图标直接引用当前仓库 SVG。<br>同一操作使用同一图形与笔画重量。<br>主界面以连续网格组织，不再使用漂浮卡片。</p><div class="row"><span class="swatch" style="background:#fffcf7;border:1px solid #d9d5cd"></span><span style="font-size:12px">正文</span><span class="swatch" style="background:#f4f0e8;border:1px solid #d9d5cd"></span><span style="font-size:12px">侧栏</span><span class="swatch" style="background:#ebebf1"></span><span style="font-size:12px">选中</span></div></section></div><div class="platform"><div class="platform-label">WINDOWS / 同一顶部网格 · 录制控件居中</div>${titlebar(false,true)}<div class="platform-label">macOS / 保持原生窗口控制位置 · 正文与控件规则相同</div>${titlebar(true,true)}</div>`;
const settings=`<div class="window settings-window">${titlebar(false)}<div class="settings-layout"><aside class="settings-nav"><h2>设置</h2>${['常规','音频输入','转写','翻译','摘要','工作区'].map(x=>`<div class="settings-tab ${x==='常规'?'selected':''}">${x}</div>`).join('')}</aside><section class="settings-body existing-general"><h3>界面语言</h3><div class="app-language-row"><label>本应用</label><details class="app-language" open><summary><span class="app-language-value">${flag('zh')}中文</span>${icon('chevron')}</summary><div class="app-language-options">${[['en','English'],['zh','中文'],['de','Deutsch'],['pl','Polski']].map(([code,name])=>`<button data-app-language="${code}" data-name="${name}" class="${code==='zh'?'selected':''}">${flag(code)}<span>${name}</span><span class="selection-mark">${code==='zh'?'✓':''}</span></button>`).join('')}</div></details></div><p class="app-language-note">本屏幕上的标签和提示。与房间语言无关——房间语言是为参会者翻译的内容。</p><div class="existing-about"><h3>版本</h3><img src="../../../src/Kanal.Host/Assets/kanal-splash-mark.png" class="about-logo" alt="Kanal"><p class="version-placeholder">版本信息沿用当前构建</p><p>本次构建以及此前版本的变更。</p><button>查看更新日志</button><h3 class="opensource-heading">开源</h3><p>当前许可说明与开源鸣谢入口维持现状。</p><button>查看开源鸣谢</button></div><div class="save-settings"><button class="primary">保存并关闭</button></div></section></div></div><div class="existing-note"><strong>房间语言保持现有设计</strong><p>继续使用当前房间语言窗口：复选框、24 px 圆形旗标、语言代码与名称、四种语言上限、其他 ISO 代码输入和完成按钮。本页只给应用界面语言选项增加圆形旗标，两者独立。</p></div>`;
const key=new URLSearchParams(location.search).get('board')||'workspace';const boards={workspace,focused:workspace,components,settings};const names={focused:['一列，专注阅读。','瑞士风格 / 展开只影响中间区域，右上角恢复语言分列。'],workspace:['Kanal，回到清晰的秩序。','瑞士风格 / 暖纸底 · 品牌双色 · 连续网格 · 当前应用功能'],components:['同一品牌，同一套规则。','从当前应用图标出发，定义排版、颜色、控件、材质和平台一致性。'],settings:['基于现有设置，只补充旗标。','常规页 / 应用界面语言增加圆形旗标；房间语言窗口维持现状。']};document.getElementById('heading').textContent=names[key]?.[0]||names.workspace[0];document.getElementById('subtitle').textContent=names[key]?.[1]||names.workspace[1];document.getElementById('board').innerHTML=boards[key]||workspace;document.querySelector(`a[href="?board=${key}"]`)?.classList.add('active');document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');const files=b.textContent==='文件';document.querySelectorAll('.assistant .insight').forEach(x=>x.hidden=files);document.querySelector('.files-pane').hidden=!files}));document.querySelectorAll('.meeting').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.meeting').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}));
function focusLanguage(column){const group=column.closest('.language-columns');const restore=column.classList.contains('expanded');group.classList.toggle('focused',!restore);group.querySelectorAll('.language-column').forEach(c=>{const active=!restore&&c===column;c.classList.toggle('expanded',active);const button=c.querySelector('.expand-language');button.setAttribute('aria-pressed',String(active));button.setAttribute('aria-label',active?'Restore all language columns':`Expand ${c.dataset.language} to fill transcript area`);button.title=active?'Restore all language columns':'Expand language column';button.innerHTML=active?`<svg class="i" viewBox="0 0 24 24"><path d="M9 4v5H4m16 0h-5V4M4 15h5v5m6 0v-5h5"/></svg>`:`<svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5m6 0h5v5M4 15v5h5m6 0h5v-5"/></svg>`})}document.querySelectorAll('.expand-language').forEach(b=>b.addEventListener('click',()=>focusLanguage(b.closest('.language-column'))));if(key==='focused')focusLanguage(document.querySelector('[data-language="DE"]'));
document.querySelectorAll('[data-app-language]').forEach(button=>button.addEventListener('click',()=>{document.querySelector('.app-language-value').innerHTML=flag(button.dataset.appLanguage)+button.dataset.name;document.querySelectorAll('[data-app-language]').forEach(b=>{b.classList.toggle('selected',b===button);b.querySelector('.selection-mark').textContent=b===button?'✓':''});document.querySelector('.app-language').open=false}));
</script>

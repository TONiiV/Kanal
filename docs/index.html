<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FCFCFD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1216" media="(prefers-color-scheme: dark)">
<title>Kanal</title>
<!-- Inlined, not linked: the page must load as one self-contained file, and a
     second request for a favicon is a second thing that can hang. Generated by
     design/kanal-icon.py — regenerate there, never hand-edit. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='114.534' fill='%23F5F0E6'/%3E%3Crect x='148' y='106' width='52' height='96' rx='26' fill='%23111A21'/%3E%3Crect x='230' y='70' width='52' height='168' rx='26' fill='%23111A21'/%3E%3Crect x='312' y='94' width='52' height='120' rx='26' fill='%23111A21'/%3E%3Crect x='132' y='276' width='248' height='38' rx='19' fill='%23B23A2E'/%3E%3Crect x='166' y='340' width='180' height='38' rx='19' fill='%239A6B10'/%3E%3Crect x='148' y='404' width='216' height='38' rx='19' fill='%231C6B58'/%3E%3C/svg%3E">
<style>
/* Swiss editorial: hairline rules as structure, size contrast as hierarchy,
   colour reserved entirely for speaker identity. See .impeccable.md. */
:root{
  color-scheme: light dark;

  /* Latin first so Polish diacritics come from the grotesque, CJK from the fallback. */
  --sans:"Helvetica Neue",Helvetica,"Segoe UI",Arial,"PingFang SC","Hiragino Sans GB",
         "Microsoft YaHei","Noto Sans SC",sans-serif;

  --sheet:#FCFCFD;
  --ink:#111A21;
  --ink-2:#4A5862;
  --ink-3:#7C8A93;
  --rule:#D5DCE1;
  --rule-faint:#E7EBEE;
  --alarm:#8B2F2F;
  --alarm-wash:#FAF2F1;

  --measure:38rem;
}
@media (prefers-color-scheme: dark){
  :root{
    --sheet:#0E151A;
    --ink:#E9EDEF;
    --ink-2:#A6B2B9;
    --ink-3:#76848C;
    --rule:#28333B;
    --rule-faint:#1B242A;
    --alarm:#E28A83;
    --alarm-wash:#1E1416;
  }
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--sheet);color:var(--ink);
  font-family:var(--sans);line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

/* ---------- masthead ---------- */

header{
  position:sticky;top:0;z-index:10;background:var(--sheet);
  border-bottom:2px solid var(--ink);
  padding-top:env(safe-area-inset-top);
}
.mast{
  max-width:var(--measure);margin:0 auto;
  display:flex;align-items:center;gap:.75rem;
  padding:.6875rem 1.25rem;
}
.mark{
  font-size:.8125rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
}
.room{
  font-size:.6875rem;letter-spacing:.08em;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* Native <select> kept for the platform picker and a11y; painted over, not replaced. */
.pick{position:relative;margin-left:auto;display:flex;align-items:baseline;gap:.4375rem}
.pick__code{font-size:1.125rem;font-weight:700;letter-spacing:.04em}
.pick__name{font-size:.75rem;color:var(--ink-3)}
.pick__chev{width:.5rem;height:.5rem;flex:none;align-self:center;stroke:var(--ink-2);
  stroke-width:2;fill:none}
.pick select{
  position:absolute;inset:-.5rem -.25rem;width:calc(100% + .5rem);height:calc(100% + 1rem);
  opacity:0;appearance:none;-webkit-appearance:none;border:0;font-size:16px;
}
.pick:focus-within{outline:2px solid var(--ink);outline-offset:.375rem;border-radius:1px}

/* ---------- connection strip ---------- */

/* A standing fact, not an alarm: ink on paper with a hairline, so it reads as part of the
   page's structure rather than as an error the reader can dismiss as noise. It lives inside
   the sticky masthead deliberately — the feed follows the newest utterance, so a participant
   spends the meeting scrolled to the bottom, and a notice left in the flow would be read
   once and never again. Being told you are on tape is not a one-off announcement. */
#rec{display:none;border-top:1px solid var(--rule)}
#rec.show{display:block}
#rec p{
  max-width:var(--measure);margin:0 auto;padding:.5rem 1.25rem;
  color:var(--ink-2);font-size:.8125rem;letter-spacing:.01em;
}

#status{display:none;background:var(--alarm-wash);border-bottom:1px solid var(--rule)}
#status.show{display:block}
#status p{
  max-width:var(--measure);margin:0 auto;padding:.5rem 1.25rem;
  color:var(--alarm);font-size:.8125rem;letter-spacing:.01em;
}

/* ---------- feed ---------- */

main{max-width:var(--measure);margin:0 auto;padding:1.75rem 1.25rem 7rem}

.rec{
  --speaker:#4C5C68;
  border-top:1px solid var(--rule);
  padding-top:.8125rem;margin-bottom:1.75rem;
  animation:enter .42s cubic-bezier(.22,1,.36,1) both;
}
.rec__meta{
  display:flex;align-items:center;gap:.5rem;
  font-size:.6875rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  margin-bottom:.375rem;
}
.rec__who{color:var(--speaker)}
.rec__lang{color:var(--ink-3);font-weight:400;letter-spacing:.14em}
.rec__cs{color:var(--ink-3);font-weight:400;letter-spacing:0}
.rec__cs[hidden]{display:none}

.rec__text{
  margin:0;
  font-size:clamp(1.0625rem,1rem + .4vw,1.25rem);
  line-height:1.62;
}
.rec.partial .rec__text,
.rec.pending .rec__text{color:var(--ink-3)}

.rec__src{
  margin:.625rem 0 0;padding-left:.875rem;border-left:1px solid var(--rule-faint);
  color:var(--ink-3);font-size:.875rem;line-height:1.6;
}
.rec__src[hidden]{display:none}

/* The newest utterance: a heavier rule in the speaker's colour, more air above it,
   and a larger setting. Colour still says "who"; size says "now". */
.rec--live{
  border-top:3px solid var(--speaker);
  margin-top:2.5rem;padding-top:1rem;
}
.rec--live:first-child{margin-top:0}
.rec--live .rec__meta{font-size:.75rem;margin-bottom:.5rem}
.rec--live .rec__text{
  font-size:clamp(1.375rem,1.15rem + 1.1vw,1.875rem);
  line-height:1.44;letter-spacing:-.008em;
}
.rec--live .rec__src{font-size:.9375rem}

/* Still being recognised — the only moving thing on the page. */
.rec--live.partial .rec__meta::after{
  content:"";width:.4375rem;height:.4375rem;background:var(--speaker);
  animation:breathe 1.7s ease-in-out infinite;
}

@keyframes enter{from{opacity:0;transform:translateY(.625rem)}to{opacity:1;transform:none}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.22}}

/* ---------- empty state ---------- */

.empty{padding:3.5rem 0 0;max-width:26rem}
.empty__title{
  margin:0 0 .625rem;font-size:1.5rem;font-weight:400;color:var(--ink-2);letter-spacing:-.01em;
}
.empty__hint{margin:0;font-size:.9375rem;color:var(--ink-3);line-height:1.7}

@media (prefers-color-scheme: dark){
  /* Speaker hues are picked for paper; lift them off the dark sheet. */
  .rec__who{color:color-mix(in oklab,var(--speaker),#FFF 40%)}
  .rec--live{border-top-color:color-mix(in oklab,var(--speaker),#FFF 40%)}
  .rec--live.partial .rec__meta::after{background:color-mix(in oklab,var(--speaker),#FFF 40%)}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<header>
  <div class="mast">
    <span class="mark">Kanal</span>
    <span class="room" id="room"></span>
    <label class="pick">
      <span class="pick__code" id="langCode"></span>
      <span class="pick__name" id="langName"></span>
      <svg class="pick__chev" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 3.5 5 7.5 9 3.5"/></svg>
      <select id="lang"></select>
    </label>
  </div>
  <div id="rec" role="status" aria-live="polite"><p></p></div>
</header>
<div id="status" role="status" aria-live="polite"><p></p></div>
<main id="feed" aria-live="polite" aria-atomic="false"></main>

<script>
/* Kanal read-only mobile client.
 *
 * Wire protocol: RelayJson messages from the host (camelCase, "type" discriminator):
 *   utterance.upsert  — replace record in place by utterance.id
 *   translation.upsert — merge if sourceRevision is current
 *   speaker.upsert    — re-resolve names/colors of ALL history records (rename + merge)
 *   room.snapshot     — full state; requested on join and after reconnect
 *   room.config       — language list for the picker
 *
 * Transports:
 *   ?demo=1                    — scripted demo, no network
 *   #room=<capability>&vk=<key> — signed Supabase broadcast; fragment stays out of HTTP logs
 *
 * No external CSS or fonts: Google Fonts is blocked in mainland China and the Chinese
 * supplier is a primary reader. The Supabase SDK is the only runtime import.
 */
"use strict";

const CACHE_LIMIT = 50; // survive lock-screen reconnects without a blank page
const STICK_SLOP = 160; // px from the bottom that still counts as "following along"
const params = new URLSearchParams(location.search);
const invite = new URLSearchParams(location.hash.replace(/^#/, ""));
const roomParam = invite.get("room");
const verificationKeyParam = invite.get("vk");

// Publishable configuration is public by design. It identifies the Supabase project; the
// unguessable room capability controls discovery and the per-room key authenticates the host.
const SUPABASE_URL = "https://muwffgozlmjafsoykqfr.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_oXkDmUJWWh6R0xbR2dpD-A_txxb8O35";

// Cache is per room: a phone that joins meeting B must never open on meeting A's history.
// Only a real room join touches storage — demo runs and paramless loads neither read, write,
// nor prune, so a stray bare-URL visit can't wipe the room cache a reconnect depends on, and
// scripted demo content is never persisted as if it were meeting record. On join, other
// rooms' caches (and the pre-room-scoped "kanal.cache" key) are dropped so old meetings
// don't accumulate in localStorage.
let CACHE_KEY = !params.get("demo") && roomParam
  ? "kanal.cache::" + roomParam : null;

function pruneOtherCaches() {
  if (!CACHE_KEY) return;
  for (const k of Object.keys(localStorage)) {
    if (k.startsWith("kanal.cache") && k !== CACHE_KEY) localStorage.removeItem(k);
  }
}
pruneOtherCaches();

/* Chrome follows the reader's chosen language — a Polish contractor should not have to
   read a Chinese error string. Falls back to English for any other ISO code. */
const UI = {
  zh:{name:"中文",waiting:"等待发言",hint:"发言会实时出现在这里，译文在上、原文在下。右上角可切换语言。",
      connecting:"连接中…",reconnecting:"连接已断开，正在重连…",failed:"连接失败",untrusted:"已拦截无法验证的会议消息。",
      missing:"缺少参数。请扫描主机端的二维码打开此页面。",codeswitch:"混合语种",original:"原文",
      ended:"会议已结束。记录保留在此页面。",moved:"会议已重新开始，正在切换…",paused:"已暂停 — 暂不记录。",
      rec:"本次会议正在录音，音频保存在主机本机。",recHeld:"录音已暂停，会议恢复后继续。"},
  de:{name:"Deutsch",waiting:"Warten auf Redebeiträge",hint:"Beiträge erscheinen hier in Echtzeit — Übersetzung oben, Original darunter. Sprache oben rechts.",
      connecting:"Verbinde…",reconnecting:"Verbindung getrennt, neuer Versuch…",failed:"Verbindung fehlgeschlagen",untrusted:"Eine nicht verifizierbare Nachricht wurde blockiert.",
      missing:"Parameter fehlen. Bitte den QR-Code des Hosts scannen.",codeswitch:"Gemischte Sprache",original:"Original",
      ended:"Besprechung beendet. Das Protokoll bleibt hier stehen.",moved:"Besprechung neu gestartet — wechsle…",paused:"Pausiert — es wird nichts aufgezeichnet.",
      rec:"Diese Besprechung wird aufgezeichnet. Der Ton bleibt auf dem Host-Rechner.",recHeld:"Aufzeichnung angehalten — sie läuft weiter, sobald fortgesetzt wird."},
  pl:{name:"Polski",waiting:"Oczekiwanie na wypowiedzi",hint:"Wypowiedzi pojawią się tu na żywo — tłumaczenie u góry, oryginał poniżej. Język w prawym górnym rogu.",
      connecting:"Łączenie…",reconnecting:"Rozłączono, ponawianie…",failed:"Połączenie nieudane",untrusted:"Zablokowano wiadomość, której nie można zweryfikować.",
      missing:"Brak parametrów. Zeskanuj kod QR z komputera prowadzącego.",codeswitch:"Mieszany język",original:"oryginał",
      ended:"Spotkanie zakończone. Zapis pozostaje na tej stronie.",moved:"Spotkanie uruchomione ponownie — przełączam…",paused:"Wstrzymane — nic nie jest zapisywane.",
      rec:"To spotkanie jest nagrywane. Dźwięk pozostaje na komputerze prowadzącego.",recHeld:"Nagrywanie wstrzymane — będzie kontynuowane po wznowieniu."},
  en:{name:"English",waiting:"Waiting for speech",hint:"Utterances appear here live — translation on top, original below. Language at top right.",
      connecting:"Connecting…",reconnecting:"Disconnected, reconnecting…",failed:"Connection failed",untrusted:"An unverifiable meeting message was blocked.",
      missing:"Missing parameters. Scan the QR code on the host to open this page.",codeswitch:"Mixed language",original:"original",
      ended:"Meeting ended. The record stays on this page.",moved:"Meeting restarted — switching over…",paused:"Paused — nothing is being recorded.",
      rec:"This meeting is being recorded. The audio stays on the host machine.",recHeld:"Recording held — it continues when the meeting resumes."},
};

const state = {
  lang: localStorage.getItem("kanal.lang") || "",
  languages: [],
  speakers: new Map(),   // tag -> {tag, displayName, mergedFrom, color}
  aliases: new Map(),    // merged tag -> canonical tag
  utterances: new Map(), // id -> utterance (insertion-ordered)
  statusKey: "",         // UI key, re-rendered when the language changes
  closed: false,         // host stopped this room; survives reload via the cache
  paused: false,         // host took the room off the record; also survives reload
  recording: false,      // host is writing the room's audio to a file; survives reload
};

/* Closed outranks paused: a room that ended while paused is ended, not waiting. */
const lifecycleStatus = () => state.closed ? "ended" : state.paused ? "paused" : "";

const $ = (id) => document.getElementById(id);
const t = (key) => (UI[state.lang] || UI.en)[key];

/* The people in the room are the ones entitled to know they are on tape, and this page is the
   only surface they read. Held rather than hidden during a pause: the file exists and resumes,
   and a notice that vanished would read as "it stopped". */
function setRecordingNotice() {
  const show = state.recording && !state.closed;
  const el = $("rec");
  el.querySelector("p").textContent = show ? t(state.paused ? "recHeld" : "rec") : "";
  el.classList.toggle("show", show);
}

function setStatus(key) {
  state.statusKey = key || "";
  const el = $("status");
  el.querySelector("p").textContent = state.statusKey ? t(state.statusKey) : "";
  el.classList.toggle("show", !!state.statusKey);
}

function resolveSpeaker(tag) {
  const canonical = state.aliases.get(tag) || tag;
  const s = state.speakers.get(canonical);
  return s ? { name: s.displayName || s.tag, color: s.color } : { name: tag, color: "#4C5C68" };
}

function applySpeaker(s) {
  state.speakers.set(s.tag, s);
  for (const merged of s.mergedFrom || []) {
    state.aliases.set(merged, s.tag);
    state.speakers.delete(merged);
  }
  renderAll(); // renames and merges rewrite history records
}

function applyUtterance(u) {
  state.utterances.set(u.id, u);
  renderRecord(u);
  saveCache();
}

function applyTranslation(m) {
  const u = state.utterances.get(m.utteranceId);
  if (!u || m.sourceRevision < u.revision) return; // stale — drop
  u.translations = Object.assign({}, u.translations, m.translations);
  renderRecord(u);
  saveCache();
}

function applyConfig(config) {
  state.languages = config.languages || [];
  const sel = $("lang");
  sel.innerHTML = "";
  for (const lang of state.languages) {
    const opt = document.createElement("option");
    opt.value = lang;
    opt.textContent = (UI[lang] || {}).name || lang.toUpperCase();
    sel.appendChild(opt);
  }
  if (!state.languages.includes(state.lang)) state.lang = state.languages[0] || "";
  sel.value = state.lang;
  setLanguage(state.lang, false);
}

function applySnapshot(snap) {
  applyConfig(snap.config);
  state.speakers.clear(); state.aliases.clear(); state.utterances.clear();
  for (const s of snap.speakers) applySpeaker(s);
  for (const u of snap.utterances) state.utterances.set(u.id, u);
  // a phone joining mid-pause never saw the announcement, so the snapshot carries it
  state.paused = !!snap.paused;
  state.recording = !!snap.recording;
  if (!state.closed) setStatus(lifecycleStatus());
  setRecordingNotice();
  renderAll();
  saveCache();
}

function handle(msg) {
  switch (msg.type) {
    case "utterance.upsert": applyUtterance(msg.utterance); break;
    case "translation.upsert": applyTranslation(msg); break;
    case "speaker.upsert": applySpeaker(msg.speaker); break;
    case "room.snapshot": applySnapshot(msg.snapshot); break;
    case "room.config": applyConfig(msg.config); break;
    case "room.closed": applyClosed(); break;
    case "room.moved": moveToRoom(msg.newRoomId, msg.newVerificationKey)
      .catch(() => setStatus("failed")); break;
    case "room.paused": applyPaused(msg.paused); break;
    case "room.recording": applyRecording(msg.recording); break;
  }
}

/* The operator has taken the room off the record. Said out loud rather than left to be
   inferred: a column that simply stops looks exactly like a connection that broke, and the
   one thing a participant wants to know is whether their next sentence is being recorded. */
function applyPaused(paused) {
  state.paused = !!paused;
  if (!state.closed) setStatus(lifecycleStatus());
  setRecordingNotice(); // held vs running is the difference between two true statements
  saveCache();
}

function applyRecording(recording) {
  state.recording = !!recording;
  setRecordingNotice();
  saveCache();
}

/* The room is over but the page stays useful: the transcript remains, and the channel stays
   subscribed because a restart announces itself here as room.moved. */
function applyClosed() {
  state.closed = true;
  state.recording = false; // the room is over; nothing is being written to any more
  setRecordingNotice();
  setStatus("ended");
  saveCache();
}

/* ---------- rendering: one column, chosen language on top, source below ---------- */

function recordContent(u) {
  const own = u.srcLang === state.lang;
  const translation = (u.translations || {})[state.lang];
  return {
    // the reader's column carries only their language: the transcript when the speaker
    // used it (tagged as original), otherwise the translation — never the raw source
    text: own ? u.srcText : (translation ?? "…"),
    src: own || translation == null ? "" : u.srcText,
    own,
    pending: !own && translation == null,
  };
}

/** True while the reader is at the bottom; scrolling up to re-read must not be hijacked. */
function isFollowing() {
  return window.innerHeight + window.scrollY >= document.body.scrollHeight - STICK_SLOP;
}

/** Only the last record is "live" — it carries the weight, everything above it settles. */
function markLive() {
  const feed = $("feed");
  const last = feed.querySelector(".rec:last-of-type");
  for (const el of feed.querySelectorAll(".rec--live"))
    if (el !== last) el.classList.remove("rec--live");
  if (last) last.classList.add("rec--live");
}

function renderRecord(u) {
  const feed = $("feed");
  let el = document.getElementById("u-" + u.id);
  const isNew = !el;
  const following = isNew ? isFollowing() : false;

  if (isNew) {
    const empty = feed.querySelector(".empty");
    if (empty) empty.remove();
    el = document.createElement("article");
    el.id = "u-" + u.id;
    el.className = "rec";
    el.innerHTML =
      '<div class="rec__meta"><span class="rec__who"></span><span class="rec__lang"></span>' +
      '<span class="rec__cs" hidden>⇄</span></div>' +
      '<p class="rec__text"></p><p class="rec__src" hidden></p>';
    feed.appendChild(el);
  }

  const speaker = resolveSpeaker(u.speakerTag);
  const { text, src, own, pending } = recordContent(u);
  el.style.setProperty("--speaker", speaker.color);
  el.classList.toggle("partial", u.state === "partial");
  el.classList.toggle("pending", pending);
  el.querySelector(".rec__who").textContent = speaker.name;
  el.querySelector(".rec__lang").textContent =
    (u.srcLang || "").toUpperCase() + (own ? " · " + t("original") : "");
  const cs = el.querySelector(".rec__cs");
  cs.hidden = !u.codeSwitch;
  cs.title = t("codeswitch");
  el.querySelector(".rec__text").textContent = text;
  const srcEl = el.querySelector(".rec__src");
  srcEl.textContent = src;
  srcEl.hidden = !src;

  if (isNew) {
    markLive();
    if (following) window.scrollTo({ top: document.body.scrollHeight });
  }
}

function renderEmpty() {
  const feed = $("feed");
  if (feed.querySelector(".empty")) return;
  const el = document.createElement("div");
  el.className = "empty";
  el.innerHTML = '<p class="empty__title"></p><p class="empty__hint"></p>';
  el.querySelector(".empty__title").textContent = t("waiting");
  el.querySelector(".empty__hint").textContent = t("hint");
  feed.appendChild(el);
}

function renderAll() {
  $("feed").innerHTML = "";
  if (state.utterances.size === 0) { renderEmpty(); return; }
  for (const u of state.utterances.values()) renderRecord(u);
  markLive();
}

function setLanguage(lang, persist) {
  state.lang = lang;
  if (persist) localStorage.setItem("kanal.lang", lang);
  document.documentElement.lang = lang || "en";
  $("langCode").textContent = (lang || "").toUpperCase();
  $("langName").textContent = (UI[lang] || {}).name || "";
  if (state.statusKey) setStatus(state.statusKey); // re-render chrome in the new language
  setRecordingNotice();
  renderAll();
}

$("lang").addEventListener("change", (e) => {
  // pure client-side filter: every language is already in the push stream
  setLanguage(e.target.value, true);
});

/* ---------- local cache (offline / reconnect) ---------- */

function saveCache() {
  if (!CACHE_KEY) return;
  const utterances = [...state.utterances.values()].slice(-CACHE_LIMIT);
  localStorage.setItem(CACHE_KEY, JSON.stringify({
    languages: state.languages,
    speakers: [...state.speakers.values()],
    utterances,
    closed: state.closed,
    paused: state.paused,
    recording: state.recording,
  }));
}

function loadCache() {
  if (!CACHE_KEY) return;
  try {
    const cache = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
    if (!cache) return;
    applyConfig({ languages: cache.languages });
    for (const s of cache.speakers) applySpeaker(s);
    for (const u of cache.utterances) state.utterances.set(u.id, u);
    state.closed = !!cache.closed; // a reload of a finished room must not look live
    state.paused = !!cache.paused; // …nor a reload of a paused one look like it is recording
    state.recording = !!cache.recording; // the notice must survive a lock-screen reconnect
    setRecordingNotice();
    renderAll();
  } catch { /* corrupt cache — start empty */ }
}

/* ---------- transports ---------- */

function startDemo() {
  $("room").textContent = "demo";
  const script = [
    ["S01", "zh", "这批支架的料号是 KX-4402，表面处理按上次的标准做。",
      { de: "Die Teilenummer dieser Halterungen ist KX-4402, Oberflächenbehandlung nach dem letzten Standard.",
        pl: "Numer części tych wsporników to KX-4402, obróbka powierzchni według poprzedniego standardu." }],
    ["S02", "pl", "Musimy potwierdzić termin dostawy przed końcem sierpnia.",
      { zh: "我们必须在八月底前确认交货期。", de: "Wir müssen den Liefertermin vor Ende August bestätigen." }],
    ["S03", "de", "Die Toleranzen im Zeichnungssatz sind noch nicht freigegeben.",
      { zh: "图纸中的公差还没有放行。", pl: "Tolerancje w zestawie rysunków nie zostały jeszcze zatwierdzone." }],
  ];
  applyConfig({ languages: ["zh", "de", "pl"] });
  const colors = { S01: "#B23A2E", S02: "#9A6B10", S03: "#1C6B58" };
  let i = 0;
  (function next() {
    const [tag, lang, text, translations] = script[i % script.length];
    const id = "demo-" + i;
    if (!state.speakers.has(tag))
      applySpeaker({ tag, displayName: null, mergedFrom: [], color: colors[tag] });
    let shown = 0;
    const step = Math.ceil(text.length / 4);
    const timer = setInterval(() => {
      shown += step;
      const done = shown >= text.length;
      handle({ type: "utterance.upsert", utterance: {
        id, speakerTag: tag, tStartMs: 0, tEndMs: done ? 1 : null, srcLang: lang,
        srcText: text.slice(0, shown), revision: Math.ceil(shown / step),
        state: done ? "final" : "partial", codeSwitch: false, speakerConfidence: 0.9,
        translations: done ? translations : {},
      }});
      if (done) { clearInterval(timer); i++; setTimeout(next, 1200); }
    }, 400);
  })();
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = src;
    script.onload = resolve;
    script.onerror = () => reject(new Error("SDK load failed: " + src));
    document.head.appendChild(script);
  });
}

let sb = null; // { client, channel, room, verificationKey }

function decodeBase64Url(value) {
  const standard = value.replace(/-/g, "+").replace(/_/g, "/");
  const padded = standard + "=".repeat((4 - standard.length % 4) % 4);
  const binary = atob(padded);
  return Uint8Array.from(binary, c => c.charCodeAt(0));
}

async function importVerificationKey(value) {
  return crypto.subtle.importKey(
    "spki", decodeBase64Url(value), { name: "ECDSA", namedCurve: "P-256" }, false, ["verify"]);
}

async function verifyEnvelope(envelope) {
  if (!sb || !envelope || envelope.type !== "relay.signed" || envelope.version !== 1)
    throw new Error("Unsigned relay message");
  const data = decodeBase64Url(envelope.data);
  const valid = await crypto.subtle.verify(
    { name: "ECDSA", hash: "SHA-256" },
    sb.verificationKey,
    decodeBase64Url(envelope.signature),
    data);
  if (!valid) throw new Error("Invalid relay signature");
  return JSON.parse(new TextDecoder().decode(data));
}

async function receiveEnvelope(envelope) {
  try {
    handle(await verifyEnvelope(envelope));
  } catch (error) {
    console.warn("Blocked relay message:", error);
    setStatus("untrusted");
  }
}

async function startSupabase(room, verificationKey) {
  setStatus("connecting");
  await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js");
  sb = {
    client: window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY),
    channel: null,
    room: null,
    verificationKey: await importVerificationKey(verificationKey),
  };
  subscribeRoom(room);
}

function subscribeRoom(room) {
  sb.room = room;
  $("room").textContent = room;
  const channel = sb.client.channel(room, { config: { broadcast: { self: false } } });
  channel.on("broadcast", { event: "kanal" }, (msg) => receiveEnvelope(msg.payload));
  channel.subscribe((status) => {
    // late join and reconnect recover via the host's periodic room.snapshot
    if (status === "SUBSCRIBED") setStatus(lifecycleStatus());
    else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") setStatus("reconnecting");
  });
  sb.channel = channel;
}

/* The operator restarted: the meeting continues on a new channel. Follow it rather than
   making 3-8 people rescan a QR code. The previous room's records are dropped, not merged —
   it is a different meeting, and ASR utterance ids restart at zero. */
async function moveToRoom(newRoomId, newVerificationKey) {
  if (!sb || !newRoomId || !newVerificationKey || newRoomId === sb.room) return;
  setStatus("moved");

  const verificationKey = await importVerificationKey(newVerificationKey);

  if (sb.channel) sb.client.removeChannel(sb.channel);
  sb.channel = null;

  state.speakers.clear();
  state.aliases.clear();
  state.utterances.clear();
  state.closed = false;
  state.paused = false;
  renderAll();

  CACHE_KEY = "kanal.cache::" + newRoomId;
  pruneOtherCaches();

  // a pull-to-refresh must land in the new room, not the dead one
  const url = new URL(location.href);
  url.hash = new URLSearchParams({ room: newRoomId, vk: newVerificationKey }).toString();
  history.replaceState(null, "", url);

  sb.verificationKey = verificationKey;
  subscribeRoom(newRoomId);
}

setLanguage(state.lang || "zh", false);
loadCache();
if (state.utterances.size === 0) renderEmpty();
if (params.get("demo")) {
  startDemo();
} else if (roomParam && verificationKeyParam) {
  startSupabase(roomParam, verificationKeyParam)
    .catch(() => setStatus("failed"));
} else {
  setStatus("missing");
}
</script>

name: Release

# Two gears.
#
#   workflow_dispatch  signed, notarised, stapled — uploaded as a private artifact
#   pull requests      unsigned smoke build, artefacts only
#
# The PR gear exists so the packaging chain cannot rot unnoticed between releases, and it is
# path-filtered so ordinary PRs stay on the fast ubuntu loop in ci.yml. It also covers fork PRs,
# which cannot read secrets and therefore must be able to build unsigned.
#
# There is deliberately no tag gear. The alpha goes to named testers over a private, revocable
# link, and a Pre-release on a public repo is still public — so nothing here creates a GitHub
# Release. The dmg is uploaded as a workflow artifact, visible to repo collaborators, and the
# private link is minted from that file by hand. See docs/04-风控管理/上线执行方案.md.

on:
  pull_request:
    paths:
      - 'installers/**'
      - '.config/dotnet-tools.json'
      - '.github/workflows/release.yml'
      - 'src/**/*.csproj'
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, no leading v (e.g. 0.1.0-alpha.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # arm64 runner, builds osx-arm64 natively
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      # A dispatch input is the source of truth for the version. A PR smoke build has none and
      # gets 0.0.0, which is a valid MSI ProductVersion and an obviously non-releasable one.
      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            # MSI and CFBundleShortVersionString compare only numeric components. The pre-release
            # suffix is kept for the artifact name and stripped for the packages themselves.
            echo "version=${INPUT_VERSION%%-*}" >> "$GITHUB_OUTPUT"
            echo "full=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
            echo "full=0.0.0-smoke" >> "$GITHUB_OUTPUT"
          fi

      # A release that quietly comes out unsigned is worse than one that fails: it looks shippable
      # and is refused by Gatekeeper on every Mac but the one that built it. So on a dispatch the
      # secrets are mandatory, and the job dies here rather than at the end.
      - name: Signing secrets are configured
        if: github.event_name == 'workflow_dispatch' && runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PWD: ${{ secrets.MACOS_CERT_PWD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          missing=
          for name in MACOS_CERT_P12 MACOS_CERT_PWD MACOS_SIGNING_IDENTITY \
                      NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          [ -z "$missing" ] || { echo "unset secrets:$missing" >&2; exit 1; }

      # Reading secrets through env rather than interpolating into the script keeps the values off
      # the command line.
      - name: Decide whether this build signs
        id: signing
        shell: bash
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
        run: |
          if [[ "${{ runner.os }}" == "macOS" \
                && "${{ github.event_name }}" == "workflow_dispatch" \
                && -n "$CERT_P12" ]]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Building unsigned. Smoke build only - macOS will warn on first launch."
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.sign == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PWD: ${{ secrets.MACOS_CERT_PWD }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain-db"
          keychain_pwd="$(uuidgen)"

          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$keychain_pwd" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pwd" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PWD" \
            -T /usr/bin/codesign -T /usr/bin/productsign

          # Without this, codesign raises a GUI authorisation prompt. On a headless runner that is
          # a silent hang until the job times out, with nothing useful in the log.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_pwd" "$keychain"

          security list-keychain -d user -s "$keychain" login.keychain-db

          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Write notary API key
        if: steps.signing.outputs.sign == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Package
        shell: bash
        env:
          # The csproj reads MACOS_SIGN_IDENTITY; the secret is named for the value it holds.
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          dotnet build installers/Kanal.Installers.csproj \
            -t:PackInstaller \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:TargetRid=${{ matrix.rid }} \
            -p:SignBuild=${{ steps.signing.outputs.sign }}

      - name: Remove notary key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/notary.p8"

      # The testers are told to check this before installing, so it ships beside the package.
      - name: Checksums
        shell: bash
        run: |
          cd artifacts
          for f in *.dmg *.msi; do
            [ -e "$f" ] || continue
            if command -v shasum > /dev/null; then shasum -a 256 "$f" | tee "$f.sha256"
            else sha256sum "$f" | tee "$f.sha256"; fi
          done

      # Collaborators only, and it expires. The private link handed to testers is minted from this
      # file — deleting the artifact is what "pulling the download" means for an unreleased build.
      - uses: actions/upload-artifact@v4
        with:
          name: kanal-${{ steps.version.outputs.full }}-${{ matrix.rid }}
          path: |
            artifacts/*.dmg
            artifacts/*.msi
            artifacts/*.sha256
          if-no-files-found: error
          retention-days: 30

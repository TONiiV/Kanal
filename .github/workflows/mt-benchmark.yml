name: MT benchmark

on:
  workflow_dispatch:
    inputs:
      streams:
        description: Stream levels, comma-separated
        default: '1,2,4'
  push:
    branches: [feat/llama-gpu]

jobs:
  benchmark:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      STREAMS: ${{ inputs.streams || '1,2,4' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/models
          key: mt-benchmark-models-v1

      - name: Download models
        run: |
          mkdir -p "$RUNNER_TEMP/models"
          cd "$RUNNER_TEMP/models"
          while read -r repo file; do
            [ -f "$file" ] || curl -fsSL -o "$file" "https://huggingface.co/$repo/resolve/main/$file"
          done <<'EOF'
          unsloth/Qwen3.5-2B-GGUF Qwen3.5-2B-Q4_K_M.gguf
          tencent/Hy-MT2-1.8B-GGUF Hy-MT2-1.8B-Q4_K_M.gguf
          tencent/HY-MT1.5-1.8B-GGUF HY-MT1.5-1.8B-Q4_K_M.gguf
          unsloth/Qwen3.5-0.8B-GGUF Qwen3.5-0.8B-Q4_K_M.gguf
          EOF
          ls -l

      - name: Run benchmark
        run: |
          M="$RUNNER_TEMP/models"
          dotnet run -c Release --project tests/Kanal.Benchmark -- --models "$M" \
            --gguf "$M/Hy-MT2-1.8B-Q4_K_M.gguf" --gguf "$M/HY-MT1.5-1.8B-Q4_K_M.gguf" \
            --gguf "$M/Qwen3.5-0.8B-Q4_K_M.gguf" --streams "$STREAMS"
          cat kanal-benchmark-*.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mt-benchmark-macos
          path: kanal-benchmark-*.md

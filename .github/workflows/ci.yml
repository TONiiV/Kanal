name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

# a group per PR; main and nightly runs get a unique group, so none is cancelled or replaced
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # repo invariant: the GitHub Pages copy must be byte-identical to web/
      - name: web/ and docs/ pages are byte-identical
        run: cmp web/index.html docs/index.html

      - name: Brand assets are reproducible
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 design/test_kanal_icon.py
          python3 design/kanal-icon.py
          git diff --exit-code

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            optional: false
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Audio hardware
        run: system_profiler SPAudioDataType

      - name: Build
        run: dotnet build Kanal.slnx --configuration Release

      - name: Audio timing diagnostic
        run: |
          for i in 1 2 3; do
            dotnet test tests/Kanal.Core.UnitTests/Kanal.Core.UnitTests.csproj --configuration Release --no-build --filter "FullyQualifiedName~MacAudioTimingDiagnostic|FullyQualifiedName~DeliversSixteenKilohertzMonoFrames" --logger "console;verbosity=normal" || true
          done

      - name: Core unit tests
        run: dotnet test tests/Kanal.Core.UnitTests/Kanal.Core.UnitTests.csproj --configuration Release --no-build --logger "console;verbosity=normal" --collect "XPlat Code Coverage" --results-directory coverage -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.UseSourceLink=true

      - name: UI view-model unit tests
        run: dotnet test tests/Kanal.UI.UnitTests/Kanal.UI.UnitTests.csproj --configuration Release --no-build --logger "console;verbosity=normal" --collect "XPlat Code Coverage" --results-directory coverage -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.UseSourceLink=true

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/**/coverage.cobertura.xml

  coverage:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage

      - name: Merge the platform reports
        run: |
          dotnet tool restore
          dotnet reportgenerator -reports:"coverage/**/coverage.cobertura.xml" -targetdir:coverage-report -reporttypes:"Html;MarkdownSummaryGithub;Badges" -filefilters:"-**/obj/**"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # the gateway wire protocol is frozen against the desktop publisher and the mobile page;
      # these tests run the Worker and its Durable Objects in real workerd
      - name: Gateway tests
        run: npm test

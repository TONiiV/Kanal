name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # repo invariant: the GitHub Pages copy must be byte-identical to web/
      - name: web/ and docs/ pages are byte-identical
        run: cmp web/index.html docs/index.html

      - name: Brand assets are reproducible
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 design/test_kanal_icon.py
          python3 design/kanal-icon.py
          git diff --exit-code

      - name: Build
        run: dotnet build Kanal.slnx --configuration Release

      - name: Core unit tests
        run: dotnet test tests/Kanal.Core.UnitTests/Kanal.Core.UnitTests.csproj --configuration Release --no-build --logger "console;verbosity=normal"

      - name: UI view-model unit tests
        run: dotnet test tests/Kanal.UI.UnitTests/Kanal.UI.UnitTests.csproj --configuration Release --no-build --logger "console;verbosity=normal"

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # the gateway wire protocol is frozen against the desktop publisher and the mobile page;
      # these tests run the Worker and its Durable Objects in real workerd
      - name: Gateway tests
        run: npm test

name: Package smoke

# Runs installers/release.sh unsigned and throws the package away. Releases run the same script on
# the maintainer's machine: every Actions artifact of a public repository is public.

on:
  pull_request:
    paths:
      - 'installers/**'
      - '.config/dotnet-tools.json'
      - '.github/workflows/package-smoke.yml'
      - 'src/**/*.csproj'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # 0.0.0 is a valid MSI ProductVersion and an obviously non-releasable one
      - name: Package with the release script
        shell: bash
        run: bash installers/release.sh 0.0.0-smoke --unsigned
